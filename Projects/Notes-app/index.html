<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — Capture your thoughts, beautifully organized</title>
<meta name="description" content="A fast, distraction-free notes app. Jot down ideas, keep track of tasks, and revisit everything in one clean, card-based workspace.">
<meta name="keywords" content="notes app, note taking, digital notepad, note organizer">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#22303F">
<meta property="og:title" content="Notes — Capture your thoughts, beautifully organized">
<meta property="og:description" content="A fast, distraction-free notes app for capturing ideas and keeping track of what matters.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Notes",
  "applicationCategory": "ProductivityApplication",
  "operatingSystem": "Any browser",
  "description": "A fast, distraction-free notes app for capturing ideas and keeping track of what matters."
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__mark">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <rect x="5" y="3" width="24" height="28" rx="3" fill="#FFFDF8" stroke="#22303F" stroke-width="1.4"/>
      <line x1="10" y1="11" x2="24" y2="11" stroke="#C2801E" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="10" y1="16" x2="24" y2="16" stroke="#DAD3C2" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="10" y1="21" x2="19" y2="21" stroke="#DAD3C2" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <div>
      <h1 class="site-title">Notes</h1>
      <p class="site-tagline">A quiet place to put down what's on your mind.</p>
    </div>
  </div>
  <p id="note-count" aria-live="polite">0 notes</p>
</header>

<main class="app-main">

  <section id="compose-section" aria-labelledby="compose-heading">
    <div class="compose-card">
      <span class="tape" aria-hidden="true"></span>
      <h2 class="compose-heading" id="compose-heading">Write something down</h2>
      <p class="compose-subheading">It's saved the moment you hit save.</p>

      <form id="note-form" novalidate>
        <div class="form-field">
          <label for="note-title">Title</label>
          <input
            type="text"
            id="note-title"
            name="title"
            placeholder="Give it a name"
            maxlength="80"
            autocomplete="off"
            required
          >
        </div>

        <div class="form-field">
          <label for="note-content">Content</label>
          <textarea
            id="note-content"
            name="content"
            placeholder="Start typing..."
            maxlength="600"
            required
          ></textarea>
          <div class="field-meta">
            <span id="content-counter">0 / 600</span>
          </div>
        </div>

        <div class="form-actions">
          <span id="form-status" role="status"></span>
          <button type="submit" class="btn btn-primary" id="add-note-btn">Save note</button>
        </div>
      </form>
    </div>
  </section>

  <section id="notes-section" aria-labelledby="notes-heading">
    <div class="notes-section__header">
      <h2 class="notes-heading" id="notes-heading">Your notes</h2>
      <span class="notes-sort">newest first</span>
    </div>

    <ul id="notes-list"></ul>

    <div id="empty-state">
      <h3>Nothing here yet</h3>
      <p>Your first note is one form away.</p>
    </div>
  </section>

</main>

<footer class="site-footer">
  <p>Notes lives entirely in this page — refresh to start fresh.</p>
</footer>

<script>
(function () {
  "use strict";

  var form = document.getElementById("note-form");
  var titleInput = document.getElementById("note-title");
  var contentInput = document.getElementById("note-content");
  var contentCounter = document.getElementById("content-counter");
  var notesList = document.getElementById("notes-list");
  var emptyState = document.getElementById("empty-state");
  var noteCount = document.getElementById("note-count");
  var formStatus = document.getElementById("form-status");
  var fieldMeta = document.querySelector(".field-meta");

  var CONTENT_MAX = 600;
  var notes = [];

  var seedNotes = [
    {
      title: "Welcome to Notes",
      content: "This is a sample note. Try editing the form on the left to add your own, or delete this one to clear the board."
    },
    {
      title: "Grocery list",
      content: "Oats, coffee, lemons, olive oil, the good bread from the corner bakery."
    },
    {
      title: "Idea: weekend trip",
      content: "Look into the coastal trail route. Check tide times before booking anything."
    }
  ];

  function formatTimestamp(date) {
    var options = { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" };
    return date.toLocaleDateString(undefined, options);
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function updateNoteCount() {
    var n = notes.length;
    noteCount.textContent = n + (n === 1 ? " note" : " notes");
  }

  function toggleEmptyState() {
    emptyState.classList.toggle("is-visible", notes.length === 0);
  }

  function renderNote(note) {
    var li = document.createElement("li");
    li.className = "note-card";
    li.setAttribute("data-id", note.id);

    var titleEl = document.createElement("h3");
    titleEl.className = "note-card__title";
    titleEl.textContent = note.title;

    var contentEl = document.createElement("p");
    contentEl.className = "note-card__content";
    contentEl.textContent = note.content;

    var footer = document.createElement("div");
    footer.className = "note-card__footer";

    var time = document.createElement("time");
    time.className = "note-card__timestamp";
    time.textContent = formatTimestamp(note.createdAt);
    time.setAttribute("datetime", note.createdAt.toISOString());

    var delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "note-delete-btn";
    delBtn.textContent = "Delete";
    delBtn.setAttribute("aria-label", "Delete note: " + note.title);
    delBtn.addEventListener("click", function () {
      deleteNote(note.id);
    });

    footer.appendChild(time);
    footer.appendChild(delBtn);

    li.appendChild(titleEl);
    li.appendChild(contentEl);
    li.appendChild(footer);

    notesList.prepend(li);
  }

  function addNote(title, content) {
    var note = {
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())),
      title: title,
      content: content,
      createdAt: new Date()
    };
    notes.unshift(note);
    renderNote(note);
    updateNoteCount();
    toggleEmptyState();
  }

  function deleteNote(id) {
    var card = notesList.querySelector('[data-id="' + id + '"]');
    notes = notes.filter(function (n) { return n.id !== id; });
    if (card) {
      card.style.transition = "opacity 0.2s ease, transform 0.2s ease";
      card.style.opacity = "0";
      card.style.transform = "scale(0.96)";
      setTimeout(function () { card.remove(); }, 180);
    }
    updateNoteCount();
    setTimeout(toggleEmptyState, 190);
  }

  contentInput.addEventListener("input", function () {
    var len = contentInput.value.length;
    contentCounter.textContent = len + " / " + CONTENT_MAX;
    fieldMeta.classList.toggle("is-near-limit", len >= CONTENT_MAX - 30);
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var title = titleInput.value.trim();
    var content = contentInput.value.trim();

    if (!title || !content) {
      formStatus.textContent = "Add a title and some content first.";
      formStatus.style.color = "#A6493A";
      return;
    }

    addNote(title, content);
    form.reset();
    contentCounter.textContent = "0 / " + CONTENT_MAX;
    fieldMeta.classList.remove("is-near-limit");
    formStatus.style.color = "";
    formStatus.textContent = "Saved.";
    titleInput.focus();

    setTimeout(function () {
      if (formStatus.textContent === "Saved.") formStatus.textContent = "";
    }, 2200);
  });

  // seed demo notes, oldest first so the loop leaves newest on top
  seedNotes.slice().reverse().forEach(function (n, i) {
    var note = {
      id: "seed-" + i,
      title: n.title,
      content: n.content,
      createdAt: new Date(Date.now() - (seedNotes.length - i) * 1000 * 60 * 60)
    };
    notes.push(note);
  });
  notes.reverse();
  notes.forEach(renderNote);
  updateNoteCount();
  toggleEmptyState();
})();
</script>

</body>
</html>
