<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stone · Paper · Scissors</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="playground">
      <div class="title">Stone · Paper · Scissors</div>

      <div class="choice">
        <div id="userChoice">User's<br />choice</div>
        <div id="robotChoice">Robot's<br />choice</div>
      </div>

      <div class="button">

        <button class="buttons" type="button">
          🪨<br /><span class="buttonName">Stone</span>
        </button>

        <button class="buttons" type="button">
          📄<br /><span class="buttonName">Paper</span>
        </button>

        <button class="buttons" type="button">
          ✂️<br /><span class="buttonName">Scissor</span>
        </button>

      </div>

      <button id="guessBtn">Guess</button>
      
      <div class="footer">
        <p id="score">Score : 0</p>
        <button id="resetBtn">Reset</button>
      
      </div>
    </div>
  </body>
</html>
